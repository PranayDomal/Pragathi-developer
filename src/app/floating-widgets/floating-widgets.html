<div class="stack">
  <!-- chat -->
  <button type="button" class="fab chat" (click)="toggle()" aria-label="Chat with us" [attr.aria-expanded]="open()">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01M16 10h.01" stroke-width="2.4"/></svg>
    @if (!seen()) {
      <span class="dot"></span>
    }
    @if (!open()) {
      <span class="tip">Chat with us</span>
    }
  </button>

  <!-- download brochure → Enquire Now -->
  <button type="button" class="fab dl" (click)="openEnquiry()" aria-label="Download brochure">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M5 21h14"/></svg>
    <span class="tip">Download brochure</span>
  </button>

  <!-- WhatsApp -->
  <a class="fab wa" [href]="whatsappUrl" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9a2 2 0 0 1-2 2H6l-4 4V4c0-1.1.9-2 2-2h8a2 2 0 0 1 2 2v5Z"/><path d="M18 9h2a2 2 0 0 1 2 2v11l-4-4h-6a2 2 0 0 1-2-2v-1"/></svg>
    <span class="tip">Chat on WhatsApp</span>
  </a>
</div>

@if (open()) {
  <section class="panel" role="dialog" aria-label="Green Woods Concierge">
    <header class="head">
      <span class="avatar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01M16 10h.01" stroke-width="2.4"/></svg>
      </span>
      <div class="who">
        <strong>Green Woods Concierge</strong>
        <span>Typically replies instantly</span>
      </div>
      <button type="button" class="close" (click)="close()" aria-label="Close chat">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>

    <div class="msgs" #scroller>
      @for (m of messages(); track $index) {
        <div class="row" [class.user]="m.from === 'user'">
          <div class="bubble">{{ m.text }}</div>
        </div>
      }
    </div>

    @if (isDone()) {
      <div class="end">
        <strong>Chat complete — thanks!</strong>
        <button type="button" (click)="start()">Start a new conversation</button>
      </div>
    } @else if (isText()) {
      <form class="input" (submit)="send($event, box)">
        <input #box type="text" placeholder="Type your message…" autocomplete="off" [attr.inputmode]="step() === 'phone' ? 'tel' : 'text'" [disabled]="busy()" />
        <button type="submit" class="send" aria-label="Send" [disabled]="busy()">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2.5 20.5 22 12 2.5 3.5l.01 6.6L16 12 2.51 13.9z"/></svg>
        </button>
      </form>
    } @else {
      <div class="chips">
        @for (c of chips(); track c) {
          <button type="button" [disabled]="busy()" (click)="reply(c)">{{ c }}</button>
        }
      </div>
    }
  </section>
}
